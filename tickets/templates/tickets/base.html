
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Support Ticket System{% endblock %}</title>
</head>
<body>
    <navzz>
        <a href="{% url 'tickets' %}">My Tickets</a>
        |
        <a href="{% url 'ticket_create' %}">Create Ticket</a>
    </nav>

    <hr>
    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
